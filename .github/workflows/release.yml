name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - beta

permissions:
  contents: write
  id-token: write
  packages: write

env:
  OUTPUT_DIR: bin
  RELEASE_DIR: release
  PLUGIN_NAME: openbao-plugin-secrets-nats
  IMAGE_NAME: ghcr.io/gabber235/openbao-plugin-secrets-nats

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    if: "inputs.force || (!contains(github.event.head_commit.message, '(no ci)') && !startsWith(github.event.head_commit.message, 'chore'))"
    outputs:
      tag: ${{ steps.version.outputs.new_tag }}
      version: ${{ steps.version.outputs.new_version }}
      changelog: ${{ steps.version.outputs.changelog }}
      type: ${{ steps.version.outputs.release_type }}
    steps:
      - uses: actions/checkout@v6
      - name: Determine next version
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          dry_run: true
          github_token: ${{ github.token }}

  build:
    name: Build
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: ['linux', 'windows', 'darwin']
        architecture: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build the artifacts
        run: |
          make "OUTPUT_DIR=${{ env.OUTPUT_DIR }}" "GOOS=${{ matrix.os }}" "GOARCH=${{ matrix.architecture }}" VERSION=${{ needs.version.outputs.tag }} build

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}-${{ matrix.architecture }}
          path: ${{ env.OUTPUT_DIR }}/*
          retention-days: 1
          overwrite: true

  release:
    name: Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.OUTPUT_DIR }}
          pattern: plugin-*
          merge-multiple: true

      - name: Package / Update README.md / Update Wiki
        id: package
        run: |
          make "OUTPUT_DIR=${{ env.OUTPUT_DIR }}" "RELEASE_DIR=${{ env.RELEASE_DIR }}" package
          make "IMAGE_NAME=${{ env.IMAGE_NAME }}" "VERSION=${{ needs.version.outputs.tag }}" "SHA256SUM=$(cat "$RELEASE_DIR/$PLUGIN_NAME-linux-amd64.sha256" | cut -d' ' -f1)" update-readme
          echo "changelog<<__EOF__" >> "$GITHUB_OUTPUT"
          echo "${{ needs.version.outputs.changelog }}" >> "$GITHUB_OUTPUT"
          echo "### sha256" >> "$GITHUB_OUTPUT"
          echo "\`\`\`" >> "$GITHUB_OUTPUT"
          echo "$(make "RELEASE_DIR=${{ env.RELEASE_DIR }}" print-sha256)" >> "$GITHUB_OUTPUT"
          echo "\`\`\`" >> "$GITHUB_OUTPUT"
          echo "__EOF__" >> "$GITHUB_OUTPUT"

      - name: Commit & Push
        uses: EndBug/add-and-commit@v9.1.4
        with:
          add: README.md
          author_name: github-actions[bot]
          author_email: 41898282+github-actions[bot]@users.noreply.github.com
          message: |
            chore: Release ${{ needs.version.outputs.tag }}

            - Workflow: ${{ github.workflow }} (#${{ github.run_number }})
            - Actor: ${{ github.actor }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          tag: ${{ needs.version.outputs.tag }}

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          body: ${{ steps.package.outputs.changelog }}

      - name: Upload artifacts
        run: gh release upload "${{ needs.version.outputs.tag }}" "${{ env.RELEASE_DIR }}/*"
        env:
          GH_TOKEN: ${{ github.token }}

  push-oci:
    name: Push OCI
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      BUILDX_NO_DEFAULT_ATTESTATIONS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.OUTPUT_DIR }}
          pattern: plugin-*
          merge-multiple: true

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push per platform
        run: |
          declare -A PLATFORM_TAGS=(
            ["darwin/amd64"]="darwin-amd64"
            ["darwin/arm64"]="darwin-arm64"
            ["linux/amd64"]="linux-amd64"
            ["linux/arm64/v8"]="linux-arm64"
            ["windows/amd64"]="windows-amd64"
            ["windows/arm64"]="windows-arm64"
          )
          for plat in "${!PLATFORM_TAGS[@]}"; do
            suffix="${PLATFORM_TAGS[$plat]}"
            docker buildx build \
              --push \
              --platform "$plat" \
              --tag "${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-$suffix" \
              --annotation org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              --build-arg BIN=${{ env.OUTPUT_DIR }} \
              --build-arg PLUGIN_NAME=${{ env.PLUGIN_NAME }} \
              --file Containerfile \
              .
          done

      - name: Create manifest list
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }} \
            $(docker buildx imagetools inspect --raw ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-darwin-amd64 | jq -r '. | "\(.config.digest)@darwin/amd64"' ) \
            $(docker buildx imagetools inspect --raw ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-darwin-arm64 | jq -r '. | "\(.config.digest)@darwin/arm64"' ) \
            $(docker buildx imagetools inspect --raw ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-linux-amd64 | jq -r '. | "\(.config.digest)@linux/amd64"' ) \
            $(docker buildx imagetools inspect --raw ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-linux-arm64 | jq -r '. | "\(.config.digest)@linux/arm64"' ) \
            $(docker buildx imagetools inspect --raw ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-windows-amd64 | jq -r '. | "\(.config.digest)@windows/amd64"' ) \
            $(docker buildx imagetools inspect --raw ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-windows-arm64 | jq -r '. | "\(.config.digest)@windows/arm64"' )

          # Now fix the linux/arm64 entry to add v8 variant
          # Pull the manifest list, replace the arm64 platform with arm64/v8, push back
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }} \
            $(docker buildx imagetools inspect --raw ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-darwin-amd64 | jq -r '.manifests[0].digest + "@darwin/amd64"') \
            $(docker buildx imagetools inspect --raw ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-darwin-arm64 | jq -r '.manifests[0].digest + "@darwin/arm64"') \
            $(docker buildx imagetools inspect --raw ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-linux-amd64 | jq -r '.manifests[0].digest + "@linux/amd64"') \
            $(docker buildx imagetools inspect --raw ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-linux-arm64 | jq -r '.manifests[0].digest + "@linux/arm64/v8"') \
            $(docker buildx imagetools inspect --raw ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-windows-amd64 | jq -r '.manifests[0].digest + "@windows/amd64"') \
            $(docker buildx imagetools inspect --raw ${{ env.IMAGE_NAME }}:${{ needs.version.outputs.tag }}-windows-arm64 | jq -r '.manifests[0].digest + "@windows/arm64"')

  update-wiki:
    name: Update Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: GitHub Wiki Action
        uses: Andrew-Chen-Wang/github-wiki-action@v5.0.3
        with:
          strategy: init
          path: docs/
          preprocess: true
